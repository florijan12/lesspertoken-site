name: Inspect price APIs (temporary)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print API data
        env:
          SAYGM_API_KEY: ${{ secrets.SAYGM_API_KEY }}
        run: python inspect_api.py
